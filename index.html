<!doctype html>
<html lang="he" dir="rtl">
<head>

<style>
/* Layout: one centered card, one question per screen, progress rail on top, big tap targets for phones */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#16203A; --muted:#5B6683; --line:#D9DEEA;
  --navy:#1B3A7A; --gold:#C99A2E; --gold-soft:#FBF3DF; --accent:#1E5BC6; --on-accent:#FFFFFF;
  --ok:#14804A; --warn:#B3261E; --field:#F7F9FD;
  --display:"Rubik","Heebo",system-ui,sans-serif; --body:"Heebo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#171F35; --ink:#EEF1F8; --muted:#A3ADC6; --line:#2C3756;
  --navy:#9DB7F0; --gold:#E2B850; --gold-soft:#2A2513; --accent:#7FA6F5; --on-accent:#0E1424;
  --ok:#5CCB8F; --warn:#FF8A80; --field:#1D2741; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#171F35; --ink:#EEF1F8; --muted:#A3ADC6; --line:#2C3756;
  --navy:#9DB7F0; --gold:#E2B850; --gold-soft:#2A2513; --accent:#7FA6F5; --on-accent:#0E1424;
  --ok:#5CCB8F; --warn:#FF8A80; --field:#1D2741; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;padding-inline:16px;padding-block:20px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px}
header svg{width:48px;height:48px;flex:none}
header h1{font-family:var(--display);font-size:1.15rem;margin:0;line-height:1.25;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.9rem}
.rail{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.stepinfo{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;min-height:300px}
.q{font-family:var(--display);font-size:1.45rem;font-weight:700;margin:0;text-wrap:balance}
.hint{color:var(--muted);margin:-8px 0 0;font-size:.95rem}
.req{color:var(--warn);font-size:.85rem;font-weight:500}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:.95rem}
input,select{font:inherit;font-size:1.1rem;padding:14px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.choice{font:inherit;font-size:1.15rem;font-weight:700;padding:18px 10px;border-radius:14px;border:2px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--navy);background:var(--gold-soft);color:var(--navy)}
.nav{display:flex;gap:10px;margin-top:auto}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:12px;padding:14px 22px;cursor:pointer}
.btn.next{background:var(--accent);color:var(--on-accent);flex:1}
.btn.back{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn.wa{background:#1FA855;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;flex:1}
.btn.copy{background:var(--navy);color:var(--surface)}
.err{color:var(--warn);font-weight:500;min-height:1.2em;margin:0}
.sum{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum div{display:flex;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:.95rem}
.sum div:first-child{border-top:0}
.sum b{min-width:120px;color:var(--muted);font-weight:500}
.sum span{min-width:0;overflow-wrap:anywhere}
.age{color:var(--ok);font-weight:700;font-size:.95rem}
.done{text-align:center;align-items:center;justify-content:center}
.done .big{font-size:3rem;line-height:1}
textarea{font:13px/1.45 var(--body);width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field);color:var(--ink)}
.foot{color:var(--muted);font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.dsel{display:flex;gap:6px;width:100%}.dsel select{flex:1 1 0;min-width:0}.dsel select[data-dpart="m"]{flex:1.4 1 0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1B3A7A"/><g fill="none" stroke="#E2B850" stroke-width="2.6" stroke-linecap="round"><path d="M32 18v30"/><path d="M14 20c0 14 8 18 18 18s18-4 18-18"/><path d="M20 20c0 10 5 13 12 13s12-3 12-13"/><path d="M26 20c0 6 2 8 6 8s6-2 6-8"/><path d="M24 50h16"/></g><g fill="#E2B850"><circle cx="14" cy="16" r="2.4"/><circle cx="20" cy="16" r="2.4"/><circle cx="26" cy="16" r="2.4"/><circle cx="32" cy="14" r="2.6"/><circle cx="38" cy="16" r="2.4"/><circle cx="44" cy="16" r="2.4"/><circle cx="50" cy="16" r="2.4"/></g></svg>
    <div><h1>רישום מתפללים</h1><p>בית כנסת המרכזי והשקט ברחוב האלה</p></div>
  </header>
  <div class="rail" aria-hidden="true"><i id="bar"></i></div>
  <div class="stepinfo"><span id="stepLabel"></span><span id="stepCount"></span></div>
  <main class="card" id="card" aria-live="polite"></main>
  <p class="foot">הפרטים משמשים את הגבאי לחלוקת עליות לתורה בלבד.</p>
</div>

<script>
(function(){
const PARASHOT="בראשית,נח,לך לך,וירא,חיי שרה,תולדות,ויצא,וישלח,וישב,מקץ,ויגש,ויחי,שמות,וארא,בא,בשלח,יתרו,משפטים,תרומה,תצוה,כי תשא,ויקהל,פקודי,ויקהל-פקודי,ויקרא,צו,שמיני,תזריע,מצורע,תזריע-מצורע,אחרי מות,קדושים,אחרי מות-קדושים,אמור,בהר,בחוקותי,בהר-בחוקותי,במדבר,נשא,בהעלותך,שלח,קרח,חוקת,בלק,חוקת-בלק,פינחס,מטות,מסעי,מטות-מסעי,דברים,ואתחנן,עקב,ראה,שופטים,כי תצא,כי תבוא,נצבים,וילך,נצבים-וילך,האזינו,וזאת הברכה".split(",");
/*DATESEL*/
// date picker as three dropdowns (day / month / year) so people can jump straight to a year; the hidden input keeps the ISO value
const HEB_MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function dateSel(attrs,val,label){const p=String(val||"").split("-"),y=p[0]||"",m=p[1]||"",d=p[2]||"",Y=new Date().getFullYear();
  const opt=(v,t,cur)=>`<option value="${v}"${String(v)===String(cur)?" selected":""}>${t}</option>`;
  let days=opt("","יום",d);for(let i=1;i<=31;i++)days+=opt(String(i).padStart(2,"0"),i,d);
  let months=opt("","חודש",m);HEB_MONTHS.forEach((n,i)=>months+=opt(String(i+1).padStart(2,"0"),n,m));
  let years=opt("","שנה",y);for(let i=Y;i>=1900;i--)years+=opt(String(i),i,y);
  return `<span class="dsel" role="group" aria-label="${label}"><select data-dpart="d" aria-label="יום">${days}</select><select data-dpart="m" aria-label="חודש">${months}</select><select data-dpart="y" aria-label="שנה">${years}</select><input type="hidden" ${attrs} value="${val||""}"></span>`}
document.addEventListener("change",e=>{const s=e.target.closest&&e.target.closest("[data-dpart]");if(!s)return;const w=s.parentElement,h=w.querySelector("input[type=hidden]");
  const sel=p=>w.querySelector('[data-dpart="'+p+'"]');let d=sel("d").value;const m=sel("m").value,y=sel("y").value;let v="";
  if(d&&m&&y){const max=new Date(+y,+m,0).getDate();if(+d>max){d=String(max).padStart(2,"0");sel("d").value=d}v=y+"-"+m+"-"+d}
  if(v!==h.value){h.value=v;h.dispatchEvent(new Event("change",{bubbles:true}))}});
const GABAI_PHONE="972546563366";
// Firebase project that receives the encrypted forms (empty = WhatsApp only). Only the gabbai's app holds the private key.
const FB_PROJECT="aliyot-83aea";
const FB_DB="default"; // the database id is "default" (no brackets)
const INBOX_KEY={"alg": "RSA-OAEP-256", "kty": "RSA", "n": "11EB9ccLuwN0Ub8-Rmr09U-2Pf85UZF_8w2xTAEJb0P3EXq6PHqwBpvd3VuwbbH5X2Uz8Jgjgljp8rINwpMZ31U7Cf8aadvjZfFKEs46U743YI-CGz8izy3dTLAlsWAJONqPqo0Y8Vd-7X63P53DtLNc8mExOklndRq6ilxI-sp6cG2cgTvoceqHaCck8BXopK8tcKnO5RhEXAY9yj945a3kU3EH8E3BIsmWMS6w0a8NdoyWvPQKc1FjidET-FGfjEeXhrebTQEfwTUYjrcCMDxWrGqgaNEg8CoXC9wtnxDdKpQ_iT0x_VrFnB6IMOnSPg_LX1P7WSm1Ltss7MGkYNShuyblh1uuGo8oAOi-w2S786xEeMAM0X1_KBpTJfqmN3RCtYnLtv-W1pDoRujN7U1yKEosJ9UC4Y3Bzduk5yv0iynfkNoN7hZZS8U17sWjXn2Lo9p5a3Dwap4_HDY0WuaZxEaWSWHOZaySVl_iDSX1B2X5K1wFboQhQHR5Apfj", "e": "AQAB"};
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
async function encryptForGabbai(text){const s=crypto.subtle;
  const pub=await s.importKey("jwk",INBOX_KEY,{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]);
  const aes=await s.generateKey({name:"AES-GCM",length:256},true,["encrypt"]);const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=await s.encrypt({name:"AES-GCM",iv},aes,new TextEncoder().encode(text));
  const key=await s.encrypt({name:"RSA-OAEP"},pub,await s.exportKey("raw",aes));
  return JSON.stringify({v:1,k:b64(key),iv:b64(iv),d:b64(data)})}
async function saveToInbox(text){
  const c=await encryptForGabbai(text);
  const r=await fetch("https://firestore.googleapis.com/v1/projects/"+FB_PROJECT+"/databases/"+FB_DB+"/documents/inbox",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{c:{stringValue:c}}})});
  if(!r.ok)throw new Error("save "+r.status)}
let sent=false;
const WA_ICON='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>'; // international format without +, e.g. 9725XXXXXXXX. Empty = the sender picks the contact in WhatsApp.
const KEY="aliyot-register-draft";
let d=load()||{married:"",hasKids:"",kids:[],hasYz:"",yz:[]};let i=0;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dmy=v=>{if(!v)return"";const [y,m,dd]=v.split("-");return dd+"/"+m+"/"+y};
function age(b){if(!b)return null;const x=new Date(b+"T00:00"),n=new Date();let a=n.getFullYear()-x.getFullYear();if(n.getMonth()<x.getMonth()||(n.getMonth()===x.getMonth()&&n.getDate()<x.getDate()))a--;return a<0?null:a}

// each step: {id, label (section), render(), read(), valid()}; steps are rebuilt from the answers so far
function steps(){
  const s=[{id:"hello"},
    {id:"name",label:"פרטי העולה"},{id:"family",label:"פרטי העולה"},{id:"father",label:"פרטי העולה"},{id:"mother",label:"פרטי העולה"},{id:"tribe",label:"פרטי העולה"},
    {id:"married",label:"משפחה"}];
  if(d.married==="כן")s.push({id:"wifeMother",label:"משפחה"},{id:"wifeFather",label:"משפחה"});
  s.push({id:"hasKids",label:"ילדים"});
  if(d.hasKids==="כן"){const n=Math.max(1,d.kids.length);for(let k=0;k<n;k++){s.push({id:"kid",k,label:"ילדים"});if(k===n-1&&k<6)s.push({id:"moreKids",k,label:"ילדים"})}}
  s.push({id:"hasYz",label:"יארצייט"});
  if(d.hasYz==="כן"){const n=Math.max(1,d.yz.length);for(let k=0;k<n;k++){s.push({id:"yz",k,label:"יארצייט"});if(k===n-1&&k<1)s.push({id:"moreYz",k,label:"יארצייט"})}}
  s.push({id:"bm",label:"תאריכים"});
  if(d.married==="כן")s.push({id:"wedding",label:"תאריכים"});
  s.push({id:"other",label:"תאריכים"},{id:"contact",label:"יצירת קשר"},{id:"summary",label:"סיום"});
  return s;
}
const TEXT={name:["מה השם המלא שלך לעלייה לתורה?","למשל: יוסף חיים",true],family:["מה שם המשפחה?","",true],father:["מה שם האב?","כפי שקוראים לעלייה: ...בן ___",true],mother:["מה שם האם?","",false],
  wife:["מה שם האישה?","",false],wifeFather:["מה שם אבי האישה?","",false],wifeMother:["מה שם אם האישה?","",false]};
function yesNo(q,key,hint){return `<h2 class="q">${q}</h2>${hint?`<p class="hint">${hint}</p>`:""}<div class="choices">${["כן","לא"].map(v=>`<button type="button" class="choice" data-pick="${key}" data-v="${v}" aria-pressed="${d[key]===v}">${v}</button>`).join("")}</div>`}
function view(st){
  const t=TEXT[st.id];
  if(st.id==="hello")return `<h2 class="q">שלום! נשמח לרשום אותך לרשימת המתפללים</h2><p class="hint" style="margin:0">כמה שאלות קצרות, שאלה אחת בכל מסך. בסוף שולחים את התשובות לגבאי בוואטסאפ. זה לוקח בערך שתי דקות.</p>`;
  if(t)return `<h2 class="q">${t[0]} ${t[2]?'<span class="req">חובה</span>':""}</h2>${t[1]?`<p class="hint">${t[1]}</p>`:""}<input id="in" value="${esc(d[st.id])}" autocomplete="off" enterkeyhint="next">`;
  if(st.id==="tribe")return `<h2 class="q">כהן, לוי או ישראל? <span class="req">חובה</span></h2><div class="choices">${["כהן","לוי","ישראל"].map(v=>`<button type="button" class="choice" data-pick="tribe" data-v="${v}" aria-pressed="${d.tribe===v}">${v}</button>`).join("")}</div>`;
  if(st.id==="married")return yesNo("האם אתה נשוי?","married");
  if(st.id==="hasKids")return yesNo("האם יש לך ילדים?","hasKids","בן מגיל 13 נכנס גם הוא לרשימת העליות.");
  if(st.id==="kid"){const k=d.kids[st.k]||{};const a=age(k.birth);return `<h2 class="q">ילד ${st.k+1}</h2>
    <label class="f">שם<input id="kName" value="${esc(k.name)}" autocomplete="off"></label>
    <div class="choices">${["בן","בת"].map(v=>`<button type="button" class="choice" data-kid="${st.k}" data-v="${v}" aria-pressed="${k.gender===v}">${v}</button>`).join("")}</div>
    <label class="f">תאריך לידה${dateSel('id="kBirth"',k.birth,"תאריך לידה")}</label>
    <span class="age" id="kAge">${a!==null?"גיל "+a:""}</span>`}
  if(st.id==="moreKids")return `<h2 class="q">יש עוד ילד?</h2><div class="choices"><button type="button" class="choice" data-more="kids">כן, להוסיף</button><button type="button" class="choice" data-nomore="1">לא, להמשיך</button></div>`;
  if(st.id==="hasYz")return yesNo("האם יש לך יארצייט?","hasYz","יום השנה לפטירת קרוב משפחה. בשבוע הזה תקבל עדיפות לעלייה.");
  if(st.id==="yz"){const y=d.yz[st.k]||{};return `<h2 class="q">יארצייט ${st.k+1}</h2>
    <label class="f">תאריך הפטירה${dateSel('id="yDate"',y.date,"תאריך הפטירה")}</label>
    <label class="f">יארצייט של<input id="yFor" value="${esc(y.for)}" placeholder="למשל: אבי, אמי, סבי" autocomplete="off"></label>`}
  if(st.id==="moreYz")return `<h2 class="q">יש יארצייט נוסף?</h2><div class="choices"><button type="button" class="choice" data-more="yz">כן, להוסיף</button><button type="button" class="choice" data-nomore="1">לא, להמשיך</button></div>`;
  if(st.id==="bm")return `<h2 class="q">באיזו פרשה הייתה בר המצווה שלך?</h2><p class="hint">אפשר לדלג אם לא זוכרים.</p><select id="in"><option value="">לא זוכר / לדלג</option>${PARASHOT.map(p=>`<option${d.bm===p?" selected":""}>${p}</option>`).join("")}</select>`;
  if(st.id==="wedding")return `<h2 class="q">מתי יום הנישואין?</h2><p class="hint">אפשר לדלג.</p>${dateSel('id="in"',d.wedding,"יום הנישואין")}`;
  if(st.id==="other")return `<h2 class="q">יש תאריך מיוחד נוסף?</h2><p class="hint">למשל יום הולדת או יום עלייה לארץ. אפשר לדלג.</p>
    <label class="f">מה התאריך<input id="oLabel" value="${esc(d.otherLabel)}" placeholder="יום הולדת" autocomplete="off"></label>
    <label class="f">תאריך${dateSel('id="oDate"',d.otherDate,"תאריך")}</label>`;
  if(st.id==="contact")return `<h2 class="q">פרטים ליצירת קשר</h2><p class="hint">כדי שהגבאי יוכל לעדכן אתכם על עלייה לתורה. אפשר לדלג.</p>
    <label class="f">טלפון נייד<input id="cPhone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" value="${esc(d.phone)}" placeholder="050-0000000"></label>
    <label class="f">מייל<input id="cEmail" type="email" inputmode="email" autocomplete="email" dir="ltr" value="${esc(d.email)}" placeholder="name@example.com"></label>`;
  if(st.id==="summary")return summaryView();
}
function rows(){const r=[["שם מלא",d.name],["שם משפחה",d.family],["שם האב",d.father],["שם האם",d.mother],["שבט",d.tribe]];
  if(d.married==="כן")r.push(["אם האישה",d.wifeMother],["אב האישה",d.wifeFather]);
  if(d.hasKids==="כן")d.kids.forEach((k,n)=>{if(k&&k.name){const a=age(k.birth);r.push(["ילד "+(n+1),k.name+(k.gender?" ("+k.gender+")":"")+(a!==null?" · גיל "+a:"")])}});
  if(d.hasYz==="כן")d.yz.forEach((y,n)=>{if(y&&y.date)r.push(["יארצייט "+(n+1),dmy(y.date)+(y.for?" · "+y.for:"")])});
  r.push(["פרשת בר מצווה",d.bm],["יום נישואין",d.married==="כן"?dmy(d.wedding):""],["תאריך מיוחד",(d.otherLabel||"")+(d.otherDate?" "+dmy(d.otherDate):"")],["טלפון",d.phone],["מייל",d.email]);
  return r.filter(x=>x[1]&&String(x[1]).trim())}
// the message the gabbai pastes into the app; labels match the app's import columns exactly
function message(){const L=["טופס מתפלל · גבאי עליות"];const add=(k,v)=>{if(v&&String(v).trim())L.push(k+": "+String(v).trim())};
  add("שם מלא (לעלייה לתורה)",d.name);add("שם משפחה",d.family);add("שם האב",d.father);add("שם האם",d.mother);add("שבט",d.tribe);
  if(d.married==="כן"){add("שם אם האישה",d.wifeMother);add("שם אב האישה",d.wifeFather)}
  if(d.hasKids==="כן")d.kids.forEach((k,n)=>{if(k&&k.name)L.push("ילד "+(n+1)+": "+k.name+" | "+(k.gender||"")+" | "+dmy(k.birth))});
  add("האם יש יארצייט?",d.hasYz||"");
  if(d.hasYz==="כן")d.yz.forEach((y,n)=>{if(y&&y.date){add("תאריך פטירה "+(n+1),dmy(y.date));add("יארצייט של "+(n+1),y.for)}});
  add("פרשת בר מצווה",d.bm);if(d.married==="כן")add("יום נישואין",dmy(d.wedding));add("תאריך מיוחד אחר: מה",d.otherLabel);add("תאריך מיוחד אחר: תאריך",dmy(d.otherDate));
  add("טלפון",d.phone);add("מייל",d.email);
  return L.join("\n")}
function summaryView(){const msg=message();const url="https://wa.me/"+GABAI_PHONE+"?text="+encodeURIComponent(msg);
  return `<h2 class="q">כמעט סיימנו. כך נראים הפרטים:</h2>
  <div class="sum">${rows().map(r=>`<div><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("")}</div>
  ${FB_PROJECT?`<p class="hint" style="margin:0">לחצו "שליחה לגבאי". הפרטים יישמרו מוצפנים אצל הגבאי, ואז ייפתח וואטסאפ עם הודעה קצרה לגבאי. לוחצים בו שליחה וזהו.</p>
  <button type="button" class="btn wa" id="sendBtn">${WA_ICON}שליחה לגבאי</button>
  <p class="hint" id="sendStatus" role="status" style="margin:0"></p>`:`<p class="hint" style="margin:0">לחצו "שליחה בוואטסאפ" ושלחו את ההודעה לגבאי כמו שהיא.</p>
  <a class="btn wa" href="${url}" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>שליחה בוואטסאפ</a>`}
  <button type="button" class="btn copy" id="copyBtn">העתקת ההודעה</button>
  <textarea id="msgBox" readonly aria-label="ההודעה לגבאי" hidden>${esc(msg)}</textarea>`}

function draw(){const S=steps();if(i>=S.length)i=S.length-1;const st=S[i];const card=document.getElementById("card");
  card.innerHTML=view(st)+`<p class="err" id="err"></p><div class="nav">${i>0?'<button type="button" class="btn back" id="back">הקודם</button>':""}${st.id==="summary"?"":`<button type="button" class="btn next" id="next">${st.id==="hello"?"מתחילים":"הבא"}</button>`}</div>`;
  document.getElementById("bar").style.width=Math.round(i/(S.length-1)*100)+"%";
  document.getElementById("stepLabel").textContent=st.label||"";document.getElementById("stepCount").textContent=i>0?("שלב "+i+" מתוך "+(S.length-1)):"";
  const f=card.querySelector("input:not([type=hidden]),select");if(f&&!f.value)f.focus({preventScroll:true});
}
function read(st){const v=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
  if(TEXT[st.id]||st.id==="bm"||st.id==="wedding")d[st.id]=v("in");
  if(st.id==="kid"){d.kids[st.k]=Object.assign({},d.kids[st.k],{name:v("kName"),birth:v("kBirth")})}
  if(st.id==="yz"){d.yz[st.k]={date:v("yDate"),for:v("yFor")}}
  if(st.id==="other"){d.otherLabel=v("oLabel");d.otherDate=v("oDate")}
  if(st.id==="contact"){d.phone=v("cPhone");d.email=v("cEmail")}
  save()}
function check(st){const t=TEXT[st.id];
  if(t&&t[2]&&!d[st.id])return "צריך למלא את השדה הזה כדי להמשיך.";
  if(st.id==="tribe"&&!d.tribe)return "בחרו כהן, לוי או ישראל.";
  if(st.id==="contact"&&d.phone&&d.phone.replace(/\D/g,"").length<9)return "מספר הטלפון קצר מדי. בדקו אותו, או השאירו ריק.";
  if(st.id==="contact"&&d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))return "כתובת המייל לא נראית תקינה. בדקו אותה, או השאירו ריק.";
  if(["married","hasKids","hasYz"].includes(st.id)&&!d[st.id])return "בחרו כן או לא.";
  if(st.id==="kid"&&!(d.kids[st.k]&&d.kids[st.k].name))return "כתבו את שם הילד, או חזרו אחורה ובחרו שאין ילדים.";
  if(st.id==="yz"&&!(d.yz[st.k]&&d.yz[st.k].date))return "בחרו את תאריך הפטירה.";
  return ""}
function next(){const S=steps(),st=S[i];read(st);const e=check(st);if(e){document.getElementById("err").textContent=e;return}i++;draw()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const S=steps(),st=S[i];
  if(b.id==="next")return next();
  if(b.id==="sendBtn"){if(sent)return;const st2=document.getElementById("sendStatus");b.disabled=true;b.lastChild.textContent="שולח...";const msg=message();
    saveToInbox(msg).then(()=>{sent=true;b.lastChild.textContent="נשלח ✓";st2.textContent="הפרטים נשמרו. פותחים את וואטסאפ להודעה לגבאי...";
      const short="שלום, מילאתי עכשיו טופס מתפלל באתר הרישום.\n"+[d.name,d.family].filter(Boolean).join(" ")+(d.father?" בן "+d.father:"")+"\n(הפרטים נשמרו אוטומטית באפליקציה)";
      setTimeout(()=>{location.href="https://wa.me/"+GABAI_PHONE+"?text="+encodeURIComponent(short)},700)})
    .catch(()=>{b.disabled=false;b.lastChild.textContent="שליחה לגבאי";st2.innerHTML='השמירה לא הצליחה. אפשר לשלוח את כל הפרטים בוואטסאפ: <a href="https://wa.me/'+GABAI_PHONE+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">שליחה בוואטסאפ</a>'});return}
  if(b.id==="back"){read(st);i=Math.max(0,i-1);return draw()}
  if(b.dataset.pick){read(st);d[b.dataset.pick]=b.dataset.v;if(b.dataset.pick==="hasKids"&&b.dataset.v==="כן"&&!d.kids.length)d.kids=[{}];if(b.dataset.pick==="hasYz"&&b.dataset.v==="כן"&&!d.yz.length)d.yz=[{}];save();i++;return draw()}
  if(b.dataset.kid!==undefined){read(st);const k=+b.dataset.kid;d.kids[k]=Object.assign({},d.kids[k],{gender:b.dataset.v});save();return draw()}
  if(b.dataset.more){read(st);d[b.dataset.more].push({});save();return draw()} // the new item takes this step's place
  if(b.dataset.nomore){i++;return draw()}
  if(b.id==="copyBtn"){const box=document.getElementById("msgBox");const txt=box.value;
    navigator.clipboard.writeText(txt).then(()=>{b.textContent="ההודעה הועתקה. הדביקו אותה בוואטסאפ לגבאי"},()=>{box.hidden=false;box.focus();box.select();b.textContent="סמנו את הטקסט והעתיקו"})}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();next()}});
document.addEventListener("change",e=>{if(e.target.id==="kBirth"){const a=age(e.target.value);document.getElementById("kAge").textContent=a!==null?"גיל "+a:""}});
draw();
})();
</script>

</body>
